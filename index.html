<div id="auth">
  <div class="logo"><i>T</i>TRIX <span>Pharmacy</span></div>
  <div class="tabs">
    <button class="btn on" data-t="in">Sign in</button>
    <button class="btn" data-t="up">Create account</button>
    <button class="btn" data-t="rs">Forgot?</button>
  </div>
  <div class="card">
    <div id="f-in">
      <label>Email</label><input id="inE" type="email">
      <label>Password</label><input id="inP" type="password">
      <button class="btn p" id="doIn" style="width:100%">Sign in</button>
    </div>
    <div id="f-up" style="display:none">
      <label>Pharmacy / your name</label><input id="upN">
      <label>Email</label><input id="upE" type="email">
      <label>Password (min 6)</label><input id="upP" type="password">
      <label>Security question</label>
      <select id="upQ"><option>Your first school?</option><option>Your mother's first name?</option><option>Your favourite town?</option></select>
      <label>Answer</label><input id="upA">
      <button class="btn p" id="doUp" style="width:100%">Create account</button>
      <p class="mute" style="margin-top:10px">The first account created becomes the Owner.</p>
    </div>
    <div id="f-rs" style="display:none">
      <label>Email</label><input id="rsE" type="email">
      <button class="btn sm" id="getQ">Show my security question</button>
      <p class="mute" id="rsQ" style="margin:10px 0"></p>
      <label>Answer</label><input id="rsA">
      <label>New password</label><input id="rsP" type="password">
      <button class="btn p" id="doRs" style="width:100%">Reset password</button>
    </div>
    <p class="msg" id="msg"></p>
  </div>
</div>

<div id="app">
  <div id="shade"></div>
  <nav id="side">
    <div class="logo"><i>T</i>TRIX <span>Pharmacy</span></div>
    <h6>PHARMACY OPERATIONS</h6>
    <a data-v="dash" class="on">Dashboard</a>
    <a data-v="stock">Stock &amp; batches</a>
    <a data-v="scan">Barcode scanner</a>
    <a data-v="sale">Record a sale</a>
    <a data-v="buy">Purchases &amp; suppliers</a>
    <a data-v="exp">Expiry control</a>
    <a data-v="cat">Medicine catalogue</a>
    <a data-v="rep">Reports &amp; audit</a>
    <h6>ADMINISTRATION</h6>
    <a data-v="team" id="navTeam">Team &amp; access</a>
    <a data-v="set">Settings</a>
    <a id="logout">Sign out</a>
  </nav>
  <header>
    <button class="btn" id="burger">☰</button>
    <div class="logo" style="font-size:18px">TRIX <span>Pharmacy</span></div>
    <div class="avatar" id="av">TA</div>
  </header>
  <main id="view"></main>
</div>
